function openModal(t,b){$("#modalTitle").textContent=t;$("#modalBody").innerHTML=b;$("#modal").classList.remove("hidden")}

async function load(){let [a,b,c,d,e,f,p]=await Promise.all([
supabase.from("imams").select("*").order("full_name"),supabase.from("prayers").select("*").order("sort_order"),

async function boot(){let r=await supabase.auth.getSession();session=r.data.session;if(!session){$("#loginView").classList.remove("hidden");$("#appView").classList.add("hidden");return}
$("#loginView").classList.add("hidden");$("#appView").classList.remove("hidden");$("#userEmail").textContent=session.user.email;await load();$("#roleBadge").textContent=profile?.role||"IMAM";render()}
function render(){let titles={dashboard:"Dashboard",imams:"Pengurusan Imam",schedules:"Jadual Bertugas",calendar:"Kalendar",replacements:"Penggantian Imam",unavailability:"Ketidakhadiran",attendance:"Kehadiran",reports:"Laporan"};$("#pageTitle").textContent=titles[page];$("#todayLabel").textContent=new Intl.DateTimeFormat("ms-MY",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());({dashboard:dash,imams:imamsPage,schedules:schedPage,calendar:calPage,replacements:repPage,unavailability:unavailPage,attendance:attPage,reports:reportPage}[page])()}
function dash(){let t=today(),m=t.slice(0,7),ss=schedules.filter(x=>x.duty_date===t),ms=schedules.filter(x=>x.duty_date.startsWith(m));$("#content").innerHTML=`<div class="hero"><div class="eyebrow" style="color:#b9f0d3">SELAMAT DATANG</div><h3>e-IMAM MKSM</h3><p>Sistem Pengurusan Jadual & Rekod Bertugas Imam</p><div class="quick"><button class="btn" data-go="schedules">+ Tambah Jadual</button><button class="btn" data-go="imams">+ Tambah Imam</button><button class="btn" data-go="calendar">Lihat Kalendar</button></div></div><div class="stats"><div class="stat"><div class="label">IMAM AKTIF</div><div class="num">${imams.filter(x=>x.status==="AKTIF").length}</div></div><div class="stat"><div class="label">TUGAS HARI INI</div><div class="num">${ss.length}</div></div><div class="stat"><div class="label">TUGAS BULAN INI</div><div class="num">${ms.length}</div></div><div class="stat"><div class="label">PENGGANTIAN BULAN INI</div><div class="num">${replacements.filter(x=>x.replacement_date.startsWith(m)).length}</div></div></div><div class="grid-2"><div class="panel"><h3>Jadual Hari Ini</h3>${ss.length?`<div class="table-wrap"><table class="table"><tr><th>Solat</th><th>Imam</th><th>Status</th></tr>${ss.map(x=>`<tr><td>${esc(prayerName(x.prayer_id))}</td><td>${esc(imamName(x.imam_id))}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join("")}</table></div>`:`<div class="empty">Tiada jadual hari ini.</div>`}</div><div class="panel"><h3>Penggantian Terkini</h3>${replacements.slice(0,5).map(x=>`<div style="padding:9px 0;border-bottom:1px solid #edf2ef;font-size:12px"><b>${esc(imamName(x.original_imam_id))}</b> → <b>${esc(imamName(x.replacement_imam_id))}</b><br><span class="muted">${dateFmt(x.replacement_date)} · ${esc(x.reason||"")}</span></div>`).join("")||`<div class="empty">Belum ada rekod.</div>`}</div></div>`;$$("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;render()})}
function imamsPage(){$("#content").innerHTML=`<div class="page-head"><div><h3>Pengurusan Imam</h3><div class="muted small">Senarai imam</div></div>${isAdmin()?'<button class="btn primary" id="add">+ Tambah Imam</button>':""}</div><div class="panel"><div class="table-wrap"><table class="table"><tr><th>Nama</th><th>Telefon</th><th>Status</th><th>Tindakan</th></tr>${imams.map(x=>`<tr><td><b>${esc(x.full_name)}</b><br><span class="muted">${esc(x.nickname||"")}</span></td><td>${esc(x.phone||"-")}</td><td><span class="badge">${esc(x.status)}</span></td><td>${isAdmin()?`<button class="mini edit" data-id="${x.id}">Edit</button> <button class="mini del delete" data-id="${x.id}">Padam</button>`:"-"}</td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">Belum ada imam.</div></td></tr>`}</table></div></div>`;if($("#add"))$("#add").onclick=()=>imamForm();$$(".edit").forEach(b=>b.onclick=()=>imamForm(imams.find(x=>x.id===b.dataset.id)));$$(".delete").forEach(b=>b.onclick=async()=>{if(!confirm("Padam imam ini?"))return;let r=await supabase.from("imams").delete().eq("id",b.dataset.id);if(r.error)toast(r.error.message);else{await load();render();toast("Imam dipadam.")}})}
function imamForm(x=null){openModal(x?"Edit Imam":"Tambah Imam",`<form id="f" class="form-grid"><label>Nama penuh<input name="full_name" required value="${esc(x?.full_name||"")}"></label><label>Nama panggilan<input name="nickname" value="${esc(x?.nickname||"")}"></label><label>Telefon<input name="phone" value="${esc(x?.phone||"")}"></label><label>Status<select name="status"><option ${x?.status==="AKTIF"?"selected":""}>AKTIF</option><option ${x?.status==="TIDAK AKTIF"?"selected":""}>TIDAK AKTIF</option></select></label><label>Tarikh mula<input name="start_date" type="date" value="${x?.start_date||""}"></label><label>URL foto<input name="photo_url" value="${esc(x?.photo_url||"")}"></label><label class="full">Alamat<textarea name="address">${esc(x?.address||"")}</textarea></label><label class="full">Catatan<textarea name="notes">${esc(x?.notes||"")}</textarea></label><div class="full form-actions"><button type="button" class="btn secondary" data-close>Batal</button><button class="btn primary">Simpan</button></div></form>`);$("#f").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let r=x?await supabase.from("imams").update(o).eq("id",x.id):await supabase.from("imams").insert(o);if(r.error)toast(r.error.message);else{closeModal();await load();render();toast("Imam disimpan.")}}}
function schedPage(){$("#content").innerHTML=`<div class="page-head"><div><h3>Jadual Bertugas</h3><div class="muted small">Subuh · Zohor · Asar · Maghrib · Isyak · Jumaat</div></div>${isAdmin()?'<button class="btn primary" id="add">+ Tambah Jadual</button>':""}</div><div class="panel"><div class="table-wrap"><table class="table"><tr><th>Tarikh</th><th>Hari</th><th>Solat</th><th>Imam</th><th>Status</th><th>Tindakan</th></tr>${schedules.map(x=>`<tr><td>${dateFmt(x.duty_date)}</td><td>${new Intl.DateTimeFormat("ms-MY",{weekday:"short"}).format(new Date(x.duty_date+"T00:00:00"))}</td><td>${esc(prayerName(x.prayer_id))}</td><td>${esc(imamName(x.imam_id))}</td><td><span class="badge">${esc(x.status)}</span></td><td>${isAdmin()?`<button class="mini edit" data-id="${x.id}">Edit</button> <button class="mini del delete" data-id="${x.id}">Padam</button>`:"-"}</td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">Belum ada jadual.</div></td></tr>`}</table></div></div>`;if($("#add"))$("#add").onclick=()=>scheduleForm();$$(".edit").forEach(b=>b.onclick=()=>scheduleForm(schedules.find(x=>x.id===b.dataset.id)));$$(".delete").forEach(b=>b.onclick=async()=>{if(!confirm("Padam jadual ini?"))return;let r=await supabase.from("duty_schedules").delete().eq("id",b.dataset.id);if(r.error)toast(r.error.message);else{await load();render();toast("Jadual dipadam.")}})}
function scheduleForm(x=null){openModal(x?"Edit Jadual":"Tambah Jadual",`<form id="f" class="form-grid"><label>Tarikh<input name="duty_date" type="date" required value="${x?.duty_date||today()}"></label><label>Solat<select name="prayer_id" required>${opts(prayers,x?.prayer_id,"name")}</select></label><label>Imam<select name="imam_id" required>${opts(imams.filter(i=>i.status==="AKTIF"),x?.imam_id)}</select></label><label>Status<select name="status"><option>DIJADUALKAN</option><option>SELESAI</option><option>DIGANTI</option><option>BATAL</option></select></label><label class="full">Catatan<textarea name="notes">${esc(x?.notes||"")}</textarea></label><div class="full form-actions"><button type="button" class="btn secondary" data-close>Batal</button><button class="btn primary">Simpan</button></div></form>`);if(x)$('[name="status"]',$("#f")).value=x.status;$("#f").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.created_by=session.user.id;let r=x?await supabase.from("duty_schedules").update(o).eq("id",x.id):await supabase.from("duty_schedules").insert(o);if(r.error)toast(r.error.message);else{closeModal();await load();render();toast("Jadual disimpan.")}}}
function calPage(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7,c="";for(let i=0;i<start;i++)c+=`<div class="cal-day"></div>`;for(let d=1;d<=days;d++){let dt=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,ss=schedules.filter(x=>x.duty_date===dt);c+=`<div class="cal-day ${dt===today()?"today":""}"><div class="cal-date">${d}</div>${ss.slice(0,5).map(x=>`<div class="cal-event">${esc(prayerName(x.prayer_id))} · ${esc(imamName(x.imam_id))}</div>`).join("")}</div>`}$("#content").innerHTML=`<div class="page-head"><div><h3>Kalendar ${new Intl.DateTimeFormat("ms-MY",{month:"long",year:"numeric"}).format(month)}</h3></div><div class="actions"><button class="btn secondary" id="p">‹</button><button class="btn secondary" id="n">›</button></div></div><div class="panel"><div class="calendar"><div class="cal-head">Isnin</div><div class="cal-head">Selasa</div><div class="cal-head">Rabu</div><div class="cal-head">Khamis</div><div class="cal-head">Jumaat</div><div class="cal-head">Sabtu</div><div class="cal-head">Ahad</div>${c}</div></div>`;$("#p").onclick=()=>{month=new Date(y,m-1,1);render()};$("#n").onclick=()=>{month=new Date(y,m+1,1);render()}}
function repPage(){$("#content").innerHTML=`<div class="page-head"><div><h3>Penggantian Imam</h3><div class="muted small">Imam asal, pengganti dan sebab</div></div>${isAdmin()?'<button class="btn primary" id="add">+ Rekod Penggantian</button>':""}</div><div class="panel"><div class="table-wrap"><table class="table"><tr><th>Tarikh</th><th>Asal</th><th>Pengganti</th><th>Sebab</th><th>Tindakan</th></tr>${replacements.map(x=>`<tr><td>${dateFmt(x.replacement_date)}</td><td>${esc(imamName(x.original_imam_id))}</td><td>${esc(imamName(x.replacement_imam_id))}</td><td>${esc(x.reason||"-")}</td><td>${isAdmin()?`<button class="mini del delete" data-id="${x.id}">Padam</button>`:"-"}</td></tr>`).join("")||`<tr><td colspan="5"><div class="empty">Belum ada rekod.</div></td></tr>`}</table></div></div>`;if($("#add"))$("#add").onclick=()=>repForm();$$(".delete").forEach(b=>b.onclick=async()=>{if(!confirm("Padam rekod ini?"))return;let r=await supabase.from("replacements").delete().eq("id",b.dataset.id);if(r.error)toast(r.error.message);else{await load();render();toast("Rekod dipadam.")}})}
function repForm(){openModal("Rekod Penggantian",`<form id="f" class="form-grid"><label>Tarikh<input name="replacement_date" type="date" required value="${today()}"></label><label>Imam Asal<select name="original_imam_id">${opts(imams)}</select></label><label>Imam Pengganti<select name="replacement_imam_id">${opts(imams)}</select></label><label class="full">Sebab<textarea name="reason" required></textarea></label><div class="full form-actions"><button type="button" class="btn secondary" data-close>Batal</button><button class="btn primary">Simpan</button></div></form>`);$("#f").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.created_by=session.user.id;let r=await supabase.from("replacements").insert(o);if(r.error)toast(r.error.message);else{closeModal();await load();render();toast("Penggantian disimpan.")}}}
function unavailPage(){$("#content").innerHTML=`<div class="page-head"><div><h3>Ketidakhadiran Imam</h3><div class="muted small">Sakit, urusan keluarga, kerja, cuti, musafir dan lain-lain</div></div><button class="btn primary" id="add">+ Rekod</button></div><div class="panel"><div class="table-wrap"><table class="table"><tr><th>Imam</th><th>Tarikh</th><th>Sebab</th><th>Status</th></tr>${unavailability.map(x=>`<tr><td>${esc(imamName(x.imam_id))}</td><td>${dateFmt(x.start_date)} – ${dateFmt(x.end_date)}</td><td>${esc(x.reason_type)} ${esc(x.reason||"")}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">Belum ada rekod.</div></td></tr>`}</table></div></div>`;$("#add").onclick=()=>unavailForm()}
function unavailForm(){openModal("Rekod Ketidakhadiran",`<form id="f" class="form-grid"><label>Imam<select name="imam_id">${opts(imams)}</select></label><label>Sebab<select name="reason_type"><option>SAKIT</option><option>URUSAN KELUARGA</option><option>KERJA</option><option>CUTI</option><option>MUSAFIR</option><option>KECEMASAN</option><option>LAIN-LAIN</option></select></label><label>Tarikh mula<input name="start_date" type="date" required value="${today()}"></label><label>Tarikh akhir<input name="end_date" type="date" required value="${today()}"></label><label class="full">Catatan<textarea name="reason"></textarea></label><div class="full form-actions"><button type="button" class="btn secondary" data-close>Batal</button><button class="btn primary">Simpan</button></div></form>`);$("#f").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.created_by=session.user.id;let r=await supabase.from("unavailability").insert(o);if(r.error)toast(r.error.message);else{closeModal();await load();render();toast("Ketidakhadiran disimpan.")}}}
function attPage(){$("#content").innerHTML=`<div class="page-head"><div><h3>Kehadiran</h3><div class="muted small">Status kehadiran bagi jadual</div></div></div><div class="panel"><div class="table-wrap"><table class="table"><tr><th>Tarikh</th><th>Solat</th><th>Imam</th><th>Status</th><th>Tindakan</th></tr>${schedules.slice(0,50).map(s=>{let a=attendance.find(x=>x.duty_schedule_id===s.id);return `<tr><td>${dateFmt(s.duty_date)}</td><td>${esc(prayerName(s.prayer_id))}</td><td>${esc(imamName(s.imam_id))}</td><td><span class="badge">${esc(a?.attendance_status||"BELUM DIREKOD")}</span></td><td>${isAdmin()?`<button class="mini mark" data-id="${s.id}">Rekod</button>`:"-"}</td></tr>`}).join("")||`<tr><td colspan="5"><div class="empty">Belum ada jadual.</div></td></tr>`}</table></div></div>`;$$(".mark").forEach(b=>b.onclick=()=>attForm(schedules.find(x=>x.id===b.dataset.id),attendance.find(x=>x.duty_schedule_id===b.dataset.id)))}
function attForm(s,a){openModal("Kehadiran",`<form id="f" class="stack"><div class="muted small">${dateFmt(s.duty_date)} · ${esc(prayerName(s.prayer_id))} · ${esc(imamName(s.imam_id))}</div><label>Status<select name="attendance_status"><option>HADIR</option><option>TIDAK HADIR</option><option>DIGANTI</option><option>LEWAT</option></select></label><label>Catatan<textarea name="notes">${esc(a?.notes||"")}</textarea></label><div class="form-actions"><button type="button" class="btn secondary" data-close>Batal</button><button class="btn primary">Simpan</button></div></form>`);if(a)$('[name="attendance_status"]',$("#f")).value=a.attendance_status;$("#f").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));Object.assign(o,{duty_schedule_id:s.id,imam_id:s.imam_id,recorded_by:session.user.id});let r=a?await supabase.from("attendance").update(o).eq("id",a.id):await supabase.from("attendance").insert(o);if(r.error)toast(r.error.message);else{closeModal();await load();render();toast("Kehadiran disimpan.")}}}
function reportPage(){let m=today().slice(0,7),ss=schedules.filter(x=>x.duty_date.startsWith(m));$("#content").innerHTML=`<div class="page-head"><div><h3>Laporan Bulanan</h3><div class="muted small">Bulan semasa</div></div><button class="btn secondary" onclick="window.print()">Cetak</button></div><div class="stats"><div class="stat"><div class="label">JADUAL</div><div class="num">${ss.length}</div></div><div class="stat"><div class="label">PENGGANTIAN</div><div class="num">${replacements.filter(x=>x.replacement_date.startsWith(m)).length}</div></div><div class="stat"><div class="label">KETIDAKHADIRAN</div><div class="num">${unavailability.filter(x=>x.start_date.startsWith(m)||x.end_date.startsWith(m)).length}</div></div><div class="stat"><div class="label">IMAM AKTIF</div><div class="num">${imams.filter(x=>x.status==="AKTIF").length}</div></div></div>`}
supabase.auth.onAuthStateChange((_e,s)=>{session=s});boot();

</script>
</body></html>
